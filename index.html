        tailwind.config = {
            darkMode: 'class',
            theme: {

    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', Arial;
            background-color: #F8FAFC;
        }

        /* UPDATE: Container khusus preview dokumen F4/A4 yang dapat di-zoom dan di-scroll */
        .document-preview-container {
            font-family: Arial;
            color: black;
            background: #cbd5e1; /* slate-300 */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .a4-wrapper {
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
            min-height: max-content;
            width: 100%;
        }

        /* UPDATE: Dimensi presisi lembar F4 Portrait & Landscape dengan Margin standar kedinasan */
        .f4-sheet {
            background: white;
            width: 21.5cm;
            min-height: 33cm;
            padding: 0.3in 0.3in 0.3in 0.5in; /* Top: 0.3in, Right: 0.3in, Bottom: 0.3in, Left: 0.5in */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .f4-landscape {
            background: white;
            width: 33cm;
            min-height: 21.5cm;
            padding: 0.3in 0.3in 0.3in 0.5in;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            position: relative;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        .word-section-break { display: none; }

        /* UPDATE: Target transformasi zoom smooth untuk dokumen */
        #doc-render-target { 
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: max-content;
        }

        #form-area {
            touch-action: pan-x pan-y;
        }

        /* UPDATE BARU: Animasi Sidebar Smooth, Responsive & Elegan dengan Cubic-Bezier */
        .sidebar-transition {
            transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        padding 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: max-width, width, opacity, transform;
        }
        .sidebar-collapsed {
            max-width: 0px !important;
            width: 0px !important;
            padding-left: 0px !important;
            padding-right: 0px !important;
            opacity: 0 !important;
            overflow: hidden !important;
            transform: translateX(-15px);
            border-right-color: transparent !important;
            pointer-events: none;
        }
        .sidebar-expanded {
            max-width: 380px !important;
            width: 100% !important;
            opacity: 1 !important;
            transform: translateX(0);
        }

        #preview-area {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        
        /* UPDATE: Pengaturan CSS khusus percetakan (Print Mode) */
        @media print {
            body * { visibility: hidden; }
            #doc-render-target, #doc-render-target * { visibility: visible; }
            #doc-render-target { position: absolute; left: 0; top: 0; transform: scale(1) !important; box-shadow: none; margin: 0; padding: 0; }
            @page { margin: 0; }
            .no-print-border { border: none !important; }
            .no-print { display: none !important; }
        }
        
        /* UPDATE: Styling elemen tabel & KOP surat resmi dokumen */
        .doc-header-table { width: 100%; margin-bottom: 2px; }
        .doc-header-table td { vertical-align: middle; }
        .doc-header-border { border-bottom: 1px solid black; margin-bottom: 15px; padding-bottom: 2px; }
        .doc-logo { width: auto; height: 1.10in; object-fit: contain; }
        
        .doc-body { font-size: 10.5pt; line-height: 1.4; text-align: justify; }
        .doc-body-jurnal { font-size: 9pt; } 
        
        .doc-table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 8px; font-size: 8.5pt; }
        .doc-table th, .doc-table td { border: 1px solid black; padding: 4px; text-align: center; vertical-align: middle; }
        .doc-table th { font-weight: bold; background-color: #f8fafc; }
        
        .info-table { font-size: 10pt; line-height: 1.3; margin-bottom: 15px;}
        .info-table td { vertical-align: middle; padding: 1px 0; border: none;}
        .info-table td:nth-child(2) { width: 15px; text-align: center; }
        
        /* UPDATE: Styling overlay tanda tangan & cap stempel sekolah */
        .doc-signatures { width: 100%; margin-top: 15px; page-break-inside: avoid; border: none;}
        .doc-signatures td { vertical-align: middle; border: none;}
        .doc-sign-box { min-height: 55px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative;}
        .doc-sign-img { height: 50px; width: auto; object-fit: contain; mix-blend-mode: multiply; position: absolute; bottom: 15px;}
        .doc-cap-img { height: 65px; width: auto; object-fit: contain; opacity: 0.85; position: absolute; bottom: 5px; left: 10px; z-index: 0; mix-blend-mode: multiply;}
        .doc-sign-name { font-weight: bold; text-decoration: underline; z-index: 1; position: relative;}
        .doc-sign-nip { z-index: 1; position: relative; }
        
        /* UPDATE: Custom Scrollbar & Toast Animations */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
            background: #1e293b; color: white; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 50;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        
        /* UPDATE: Indicator sel tabel yang dapat di-edit langsung (Inline Contenteditable) */
        td[contenteditable="true"]:hover { background-color: #fef08a; cursor: text; }
        td[contenteditable="true"]:focus { background-color: #fff; outline: 2px solid #2563EB; outline-offset: -2px; }
    </style>
</head>

    <script>
        const URL_SEKOLAH = 'https://raw.githubusercontent.com/tifalockheart930/kuroba/refs/heads/main/db_sekolah.json'; 
        const URL_GURU = 'https://raw.githubusercontent.com/tifalockheart930/kuroba/refs/heads/main/db_guru.json';       
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        
        const DEFAULT_STATE = {
            sekolah: {}, 
            guru: [],    
            activeGuruId: 20,
            pengawas: {
                nama: "Dra. Moontje Kalalo", nip: "19680305 199412 2 004",
                golongan: "IV/b", jabatan: "Pengawas Bina", instansi: "Dinas Pendidikan Daerah",
                ttdPengawas: ""
            },
            generator: {
                bulan: new Date().getMonth() + 1, 
                tahun: new Date().getFullYear(),
                nomorSurat: "900/&emsp;&emsp;/SMKN.1/TTPN/VIII-2026",
                kotaPenetapan: "Tatapaan",
                tanggalPenetapan: calculatePenetapanDate(currentMonth, currentYear)
            },
            jurnalEntries: {} 
        };
        
        let appState = null;
        let activeDocType = 'sptjm'; 
        let currentZoom = 1;
        let saveTimeout;
        let isSidebarCollapsed = false;
        
        let initialPinchDistance = null;
        let initialZoomOnPinch = 1;

        const $ = id => document.getElementById(id);
        const updateJournalUI = () => { 
            saveState(); 
            renderJurnalEditorForm($('view-content')); 
            renderDocumentPreview(); 
        };
        
        async function initApp() {
            let savedState = JSON.parse(localStorage.getItem('sertigen_state'));
            
            if (!savedState) {
                appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
                try {
                    const resSekolah = await fetch(URL_SEKOLAH);
                    if (resSekolah.ok) appState.sekolah = await resSekolah.json();
                } catch (e) {
                    appState.sekolah = { nama: "SMK CONTOH (Gagal Load Github)" };
                }
                try {
                    const resGuru = await fetch(URL_GURU);
                    if (resGuru.ok) appState.guru = await resGuru.json();
                } catch (e) {
                    appState.guru = [{ id: 1, nama: "Guru Contoh (Gagal Load Github)" }];
                }
                saveState();
            } else {
                appState = savedState;
                if (appState.guru && !Array.isArray(appState.guru)) {
                    appState.guru = [{...appState.guru, id: 1}];
                    appState.activeGuruId = 1;
                }
            }
            
            if(!appState.jurnalEntries) appState.jurnalEntries = {};
            if(!appState.holidayCache) appState.holidayCache = {};
            
            window.addEventListener('resize', autoFitPreview);
            initPinchToZoom();
            switchMode('pengaturan');
        }
        
        function saveState() {
            localStorage.setItem('sertigen_state', JSON.stringify(appState));
            showAutoSave();
        }
        
        function showAutoSave() {
            const ind = $('auto-save-indicator');
            if(!ind) return;
            ind.classList.remove('opacity-0');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { ind.classList.add('opacity-0'); }, 2000);
        }
        
        function showToast(message) {
            const toast = $('toast');
            if(!toast) return;
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            applySidebarState();
        }
        
        function applySidebarState() {
            const formArea = $('form-area');
            const previewArea = $('preview-area');
            const toggleIcon = $('toggle-sidebar-icon');
            
            if (activeDocType === 'jurnal') {
                if (isSidebarCollapsed) {
                    formArea.classList.add('sidebar-collapsed');
                    formArea.classList.remove('sidebar-expanded');
                    if (toggleIcon) {
                        toggleIcon.className = "fa-solid fa-indent text-lg text-primary transition-transform duration-300 hover:scale-110";
                    }
                } else {
                    formArea.classList.remove('sidebar-collapsed');
                    formArea.classList.add('sidebar-expanded');
                    if (toggleIcon) {
                        toggleIcon.className = "fa-solid fa-outdent text-lg text-slate-600 hover:text-primary transition-transform duration-300 hover:scale-110";
                    }
                }
            }

            // Pemicu autoFitPreview bertahap selama animasi 400ms berlangsung agar penyesuaian lembar dokumen mulus
            let frames = 0;
            const animInterval = setInterval(() => {
                autoFitPreview();
                frames++;
                if (frames >= 20) clearInterval(animInterval);
            }, 20);
        }

        /* UPDATE: Pembaruan fungsi autoFitPreview agar dokumen menyesuaikan lebar DAN tinggi layar agar seluruh lembar dokumen terlihat jelas dengan maksimal zoom 100% (1.0) */
        function autoFitPreview() {
            const previewArea = $('preview-area');
            const target = $('doc-render-target');
            if (!previewArea || !target || previewArea.classList.contains('hidden')) return;
            
            const sheet = target.querySelector('.f4-landscape, .f4-sheet');
            if (!sheet) return;
            
            const sheetWidth = sheet.offsetWidth || (activeDocType === 'jurnal' || activeDocType === 'cover' ? 1247 : 794);
            const sheetHeight = sheet.offsetHeight || 800;
            
            const containerWidth = previewArea.clientWidth - 40; 
            const containerHeight = previewArea.clientHeight - 40; 
            
            if (containerWidth <= 0 || sheetWidth <= 0 || containerHeight <= 0 || sheetHeight <= 0) return;
            
            // Hitung rasio untuk lebar dan tinggi
            const fitScaleX = containerWidth / sheetWidth;
            const fitScaleY = containerHeight / sheetHeight;
            
            // Pilih skala terkecil agar dokumen muat seutuhnya tanpa terpotong
            let fitScale = Math.min(fitScaleX, fitScaleY);
            
            // UPDATE: Membatasi maksimal zoom pada 100% (1.0) dan minimal zoom 0.35
            fitScale = Math.min(Math.max(fitScale, 0.35), 1.0);
            
            currentZoom = Math.round(fitScale * 100) / 100;
            target.style.transform = `scale(${currentZoom})`;
            
            const zoomEl = $('zoom-level');
            if (zoomEl) zoomEl.innerText = Math.round(currentZoom * 100) + '%';
        }

        function triggerAutoFitPreview() {
            autoFitPreview();
            showToast("Tampilan disesuaikan dengan ukuran layar");
        }

        function setZoom100() {
            if (Math.round(currentZoom * 100) === 100) {
                showToast("Tampilan sudah pada ukuran 100%");
                return;
            }
            currentZoom = 1.0;
            const target = $('doc-render-target');
            if (target) target.style.transform = `scale(1.0)`;
            const zoomEl = $('zoom-level');
            if (zoomEl) zoomEl.innerText = '100%';
            showToast("Tampilan diatur ke 100%");
        }

        function initPinchToZoom() {
            const previewArea = $('preview-area');
            if (!previewArea) return;

            previewArea.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialZoomOnPinch = currentZoom;
                }
            }, { passive: true });

            previewArea.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && initialPinchDistance) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scaleFactor = currentDist / initialPinchDistance;
                    let newZoom = Math.max(0.35, Math.min(2.0, initialZoomOnPinch * scaleFactor));
                    currentZoom = Math.round(newZoom * 100) / 100;
                    
                    const target = $('doc-render-target');
                    if (target) target.style.transform = `scale(${currentZoom})`;
                    const zoomEl = $('zoom-level');
                    if (zoomEl) zoomEl.innerText = Math.round(currentZoom * 100) + '%';
                }
            }, { passive: true });

            previewArea.addEventListener('touchend', function(e) {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            });
        }

        function generateJournalDays(bulan, tahun, startDay = 1, endDay = null) {
            const daysInMonth = new Date(tahun, bulan, 0).getDate();
            const actualEnd = endDay || daysInMonth;
            let entries = [];
            for(let i = startDay; i <= actualEnd; i++) {
                let d = new Date(tahun, bulan - 1, i);
                let dayIdx = d.getDay();
                if (dayIdx === 0 || dayIdx === 6) continue; 
                
                let isoDate = `${tahun}-${bulan.toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
                let holidayName = appState.holidayCache && appState.holidayCache[tahun] ? appState.holidayCache[tahun][isoDate] : null;
                let isHoliday = (holidayName !== null && holidayName !== undefined);
                
                entries.push({
                    id: `row_auto_${i}`,
                    tanggal: `${i.toString().padStart(2, '0')}/${bulan.toString().padStart(2, '0')}/${tahun}`,
                    isoDate: isoDate,
                    isHoliday: isHoliday,
                    materi: holidayName ? `${holidayName}` : '',
                    jp: '', kelas: '', hadir: '', tidakHadir: '', totalSiswa: '', masalah: '', foto: '',
                    keterangan: isHoliday ? 'Libur' : '',
                    isSubRow: false
                });

        function angkaKeTerbilang(n) {
            const satuan = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            n = Math.floor(n);
            if (n < 0) return "";
            if (n < 12) return satuan[n];
            if (n < 20) return angkaKeTerbilang(n - 10) + " belas";
            if (n < 100) return (satuan[Math.floor(n / 10)] || angkaKeTerbilang(Math.floor(n / 10))) + " puluh " + (n % 10 !== 0 ? " " + angkaKeTerbilang(n % 10) : "");
            if (n < 200) return "seratus" + (n % 100 !== 0 ? " " + angkaKeTerbilang(n - 100) : "");
            if (n < 1000) return angkaKeTerbilang(Math.floor(n / 100)) + " ratus" + (n % 100 !== 0 ? " " + angkaKeTerbilang(n % 100) : "");
            if (n < 2000) return "seribu" + (n % 1000 !== 0 ? " " + angkaKeTerbilang(n - 1000) : "");
            if (n < 10000) return angkaKeTerbilang(Math.floor(n / 1000)) + " ribu" + (n % 1000 !== 0 ? " " + angkaKeTerbilang(n % 1000) : "");
            return n.toString();
        }

        function dateToFullIndoWords(dateStr) {
            if(!dateStr) return "....................";
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return "....................";
            const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            
            const hari = days[d.getDay()];
            const tglWords = angkaKeTerbilang(d.getDate()).trim();
            const blnWords = months[d.getMonth()];
            const thnWords = angkaKeTerbilang(d.getFullYear()).trim();
            
            return `Pada hari ini ${hari} tanggal ${tglWords} bulan ${blnWords} tahun ${thnWords} saya yang <br> bertanda tangan dibawah ini :`;
        }
        
        function calculatePenetapanDate(bulan, tahun) {
            const targetBulan = parseInt(bulan);
            const targetTahun = parseInt(tahun);
            
            // Mengambil tanggal terakhir dari bulan yang dipilih (day 0 dari bulan berikutnya)
            let d = new Date(targetTahun, targetBulan, 0);
            let dayOfWeek = d.getDay(); // 0 = Minggu, 6 = Sabtu
            
            // Jika jatuh di hari Sabtu (6), mundurkan 1 hari ke Jumat
            if (dayOfWeek === 6) {
                d.setDate(d.getDate() - 1);
            } 
            // Jika jatuh di hari Minggu (0), mundurkan 2 hari ke Jumat
            else if (dayOfWeek === 0) {
                d.setDate(d.getDate() - 2);
            }
            
            const yyyy = d.getFullYear();
            const mm = (d.getMonth() + 1).toString().padStart(2, '0');
            const dd = d.getDate().toString().padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }
        
        function resizeAndCompressImage(dataUrl, callback) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                let maxW = 800; let maxH = 800;
                let w = img.width; let h = img.height;
                if(w > h) { if(w > maxW) { h *= maxW/w; w = maxW; } }
                else { if(h > maxH) { w *= maxH/h; h = maxH; } }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = dataUrl;
        }

        function updateJournalEntriesRange() {
            const jKey = getJournalKey();
            const bln = appState.generator.bulan;
            const thn = appState.generator.tahun;
            const startDay = appState.generator.tanggalAwalJurnal || 1;
            const endDay = appState.generator.tanggalAkhirJurnal || new Date(thn, bln, 0).getDate();
            let oldEntries = appState.jurnalEntries[jKey] || [];
            let newEntries = generateJournalDays(bln, thn, startDay, endDay);
            const merged = newEntries.map(newRow => {
                const existing = oldEntries.find(o => o.isoDate === newRow.isoDate && !o.isSubRow);
                return existing ? { ...newRow, materi: existing.materi, jp: existing.jp, kelas: existing.kelas, hadir: existing.hadir, tidakHadir: existing.tidakHadir, totalSiswa: existing.totalSiswa, masalah: existing.masalah, foto: existing.foto, keterangan: existing.keterangan } : newRow;
            });
            
            appState.jurnalEntries[jKey] = merged;
            saveState();
            if(activeDocType === 'jurnal' || activeDocType === 'absen' || activeDocType === 'cover') renderDocumentPreview();
        }

        function buildJurnalCalendarHTML() {
            const y = appState.generator.tahun;
            const m = appState.generator.bulan - 1;
            const startDay = appState.generator.tanggalAwalJurnal || 1;
            const endDay = appState.generator.tanggalAkhirJurnal || new Date(y, m + 1, 0).getDate();
            
            const firstDayIndex = new Date(y, m, 1).getDay(); 
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            
            let html = '<div class="grid grid-cols-7 gap-1.5 text-center text-[13px] mt-4">';
            const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
            days.forEach(d => html += `<div class="text-slate-400 font-semibold py-1">${d}</div>`);
            
            for(let i=0; i<firstDayIndex; i++) html += `<div></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                let classes = "py-2 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center ";
                
                if (d === startDay || d === endDay) {
                    classes += "bg-blue-600 text-white font-bold shadow-md transform scale-105";
                } else if (d > startDay && d < endDay) {
                    classes += "bg-blue-100 text-blue-800 font-semibold";
                } else {
                    classes += "bg-slate-50 text-slate-700 hover:bg-slate-200 font-medium border border-slate-100";
                }
                html += `<div class="${classes}" onclick="handleJurnalCalendarClick(${d})">${d}</div>`;
            }
            html += '</div>';
            return html;
        }

        function exportWord() {
            const element = $('doc-render-target');
            if(!element) return;
            
            const btn = $('btn-export-word');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i> Memproses...';
            btn.disabled = true;
            
            const g = getActiveGuru();
            const fileName = `${activeDocType.toUpperCase()} ${getNamaBulan(appState.generator.bulan)} ${g.nama.split(',')[0].replace(/\s/g, ' ')}.doc`;
            
            const clone = element.cloneNode(true);
            const placeholders = clone.querySelectorAll('.upload-placeholder, input[type="file"]');
            placeholders.forEach(el => el.remove());
            
            const sectionDivs = clone.querySelectorAll('.SectionPortrait, .SectionLandscape');
            sectionDivs.forEach(el => {
                if (el.classList.contains('SectionLandscape')) {
                    el.className = 'SectionLandscape';
                } else {
                    el.className = 'SectionPortrait';
                }
            });
            
            const htmlContent = clone.innerHTML;
            
            const header = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office'
                xmlns:w='urn:schemas-microsoft-com:office:word'
                xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Export Dokumen SertiGen</title>
                    <style>
                        ${getPageStyleHelper()}
                        body { font-family: Times New Roman; font-size: 11pt; color: black; }
                        table { border-collapse: collapse; width: 100%; }
                        th, td { padding: 4px; vertical-align: middle; }
                        .doc-table th, .doc-table td { border: 1pt solid windowtext; text-align: center; }
                        .doc-table th { font-weight: bold; background-color: #f8fafc; }
                        .info-table td { border: none; padding: 2pt; text-align: left; }
                        .doc-header-table td { border: none; }
                        .no-print-border { border: none !important; }
                        .doc-signatures td { border: none; }
                        .doc-sign-box { position: relative; text-align: center; }
                        .doc-sign-img { position: absolute; z-index: 2; height: 50px; width: auto; }
                        .doc-cap-img { position: absolute; z-index: 1; height: 65px; width: auto; opacity: 0.85; left: 10px; }
                        .word-section-break { display: block; clear: both; page-break-before: always; mso-break-type: section-break; }
                    </style>
                </head>
                <body>
                    ${htmlContent}
                </body>
            </html>`;
            
            const blob = new Blob(['\ufeff', header], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            btn.innerHTML = originalText;
            btn.disabled = false;
            showToast("Dokumen berhasil diexport ke Word.");
        }

        window.onload = initApp;
    </script>
</body>
</html>
